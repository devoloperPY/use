name: Build Modern APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # FIX 1: Jalankan Cache GRADLE di awal sebelum ada file yang dimodifikasi secara dinamis
      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # FIX 2: Pindahkan pembuatan Custom Settings ke bawah setelah inisialisasi cache selesai
      - name: Create Custom Settings Gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.org' }
              }
          }
          rootProject.name = "NexusVPN"
          include ':app'
          EOF

      - name: Apply Custom Branding
        run: |
          if [ -f "configurasi/config.json" ]; then
            APP_NAME=$(jq -r '.app_name' configurasi/config.json)
            PKG_NAME=$(jq -r '.package_name' configurasi/config.json)
            VERSION_NAME=$(jq -r '.version_name' configurasi/config.json)
            
            echo "<resources><string name=\"app_name\">$APP_NAME</string></resources>" > app/src/main/res/values/strings.xml
            
            sed -i "s|applicationId \".*\"|applicationId \"$PKG_NAME\"|g" app/build.gradle
            sed -i "s|namespace '.*'|namespace '$PKG_NAME'|g" app/build.gradle
            sed -i "s|versionName \".*\"|versionName \"$VERSION_NAME\"|g" app/build.gradle
            
            find app/src/main/java -name "*.kt" -exec sed -i "s|^package .*|package $PKG_NAME|g" {} +
          fi

      - name: Apply Custom Icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          if [ -f "configurasi/icon.png" ]; then
            cp configurasi/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp configurasi/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Copy Bahan to Assets
        run: |
          mkdir -p app/src/main/assets
          if [ -d "bahan" ]; then
            cp -r bahan/* app/src/main/assets/
          fi
          
      # FIX 3: Masukkan argumen anti-timeout secara global ke sistem operasi Ubuntu melalui GRADLE_OPTS
      - name: Build APK with Gradle
        run: |
          export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=500000 -Dorg.gradle.internal.http.socketTimeout=500000 -Dhttp.keepAlive=false -Dsun.net.client.defaultConnectTimeout=500000 -Dsun.net.client.defaultReadTimeout=500000"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
