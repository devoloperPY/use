name: Build Modern APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK Environment
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Copy Bahan to Assets
        run: |
          mkdir -p app/src/main/assets
          if [ -d "bahan" ]; then
            cp -r bahan/* app/src/main/assets/
            echo "Bahan berhasil disalin ke assets!"
          else
            echo "Folder bahan tidak ditemukan!"
          fi
      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modern-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
