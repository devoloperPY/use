name: Build Modern APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Create Custom Settings Gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NexusVPN"
          include ':app'
          EOF

      - name: Apply Custom Branding & Strip Packages
        run: |
          if [ -f "configurasi/config.json" ]; then
            APP_NAME=$(jq -r '.app_name' configurasi/config.json)
            PKG_NAME=$(jq -r '.package_name' configurasi/config.json)
            VERSION_NAME=$(jq -r '.version_name' configurasi/config.json)
            
            # Ganti nama app & build.gradle
            echo "<resources><string name=\"app_name\">$APP_NAME</string></resources>" > app/src/main/res/values/strings.xml
            sed -i "s|applicationId \".*\"|applicationId \"$PKG_NAME\"|g" app/build.gradle
            sed -i "s|namespace '.*'|namespace '$PKG_NAME'|g" app/build.gradle
            sed -i "s|versionName \".*\"|versionName \"$VERSION_NAME\"|g" app/build.gradle
            
            # HAPUS BARIS "package ..." DI SEMUA FILE KOTLIN
            find app/src/main/java -name "*.kt" -exec sed -i '/^package /d' {} +
          fi

      - name: Force Custom Icon Auto-Resize
        run: |
          rm -rf app/src/main/res/mipmap-anydpi-v26
          if [ -f "configurasi/icon.png" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p app/src/main/res/mipmap-$dpi
              case $dpi in
                mdpi) size=48 ;;
                hdpi) size=72 ;;
                xhdpi) size=96 ;;
                xxhdpi) size=144 ;;
                xxxhdpi) size=192 ;;
              esac
              convert configurasi/icon.png -resize ${size}x${size} app/src/main/res/mipmap-$dpi/ic_launcher.png
              convert configurasi/icon.png -resize ${size}x${size} app/src/main/res/mipmap-$dpi/ic_launcher_round.png
            done
          fi

      - name: Copy Bahan to Assets
        run: |
          mkdir -p app/src/main/assets
          if [ -d "bahan" ]; then
            cp -r bahan/* app/src/main/assets/
          fi
          
      - name: Build APK with Local Gradle
        run: |
          export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=500000 -Dorg.gradle.internal.http.socketTimeout=500000 -Dhttp.keepAlive=false -Dsun.net.client.defaultConnectTimeout=500000 -Dsun.net.client.defaultReadTimeout=500000"
          gradle assembleDebug --no-daemon
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
